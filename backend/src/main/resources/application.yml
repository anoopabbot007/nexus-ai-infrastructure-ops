server:
  port: 8080
spring:
  application:
    name: nexus-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${DATABASE_USER:nexus}
    password: ${DATABASE_PASSWORD:nexus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
agent-service:
  base-url: ${AGENT_SERVICE_URL:http://localhost:8000}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  agent-timeout-ms: ${AGENT_TIMEOUT_MS:50000}

